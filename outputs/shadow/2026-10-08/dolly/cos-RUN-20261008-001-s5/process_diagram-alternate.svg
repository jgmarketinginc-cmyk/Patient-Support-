<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#1F3A5F"/><rect width="1600" height="36" fill="#C9A227"/><text x="60" y="110" font-family="Georgia, serif" font-size="34" font-weight="bold" fill="#FFFFFF" text-anchor="start"><tspan x="60" dy="0">The AI Agency Blueprint</tspan></text><text x="60" y="200" font-family="Georgia, serif" font-size="52" font-weight="bold" fill="#FFFFFF" text-anchor="start"><tspan x="60" dy="0">How questions are handled</tspan></text><rect x="60" y="320" width="264" height="300" rx="14" fill="#C9A227"/><text x="84" y="380" font-family="Georgia, serif" font-size="44" font-weight="bold" fill="#1A1A1A" text-anchor="start"><tspan x="84" dy="0">1</tspan></text><text x="84" y="450" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="normal" fill="#1A1A1A" text-anchor="start"><tspan x="84" dy="0">Question arrives</tspan><tspan x="84" dy="33">by email, phone</tspan><tspan x="84" dy="33">or portal.</tspan></text><polygon points="330,470 358,470 344,490" fill="#FFFFFF" transform="rotate(-90 344 480)"/><rect x="364" y="320" width="264" height="300" rx="14" fill="#C9A227"/><text x="388" y="380" font-family="Georgia, serif" font-size="44" font-weight="bold" fill="#1A1A1A" text-anchor="start"><tspan x="388" dy="0">2</tspan></text><text x="388" y="450" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="normal" fill="#1A1A1A" text-anchor="start"><tspan x="388" dy="0">System checks it</tspan><tspan x="388" dy="33">against documents</tspan><tspan x="388" dy="33">the client has</tspan><tspan x="388" dy="33">provided and</tspan><tspan x="388" dy="33">approved.</tspan></text><polygon points="634,470 662,470 648,490" fill="#FFFFFF" transform="rotate(-90 648 480)"/><rect x="668" y="320" width="264" height="300" rx="14" fill="#C9A227"/><text x="692" y="380" font-family="Georgia, serif" font-size="44" font-weight="bold" fill="#1A1A1A" text-anchor="start"><tspan x="692" dy="0">3</tspan></text><text x="692" y="450" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="normal" fill="#1A1A1A" text-anchor="start"><tspan x="692" dy="0">If answered from</tspan><tspan x="692" dy="33">approved</tspan><tspan x="692" dy="33">documents, the</tspan><tspan x="692" dy="33">response goes</tspan><tspan x="692" dy="33">out.</tspan></text><polygon points="938,470 966,470 952,490" fill="#FFFFFF" transform="rotate(-90 952 480)"/><rect x="972" y="320" width="264" height="300" rx="14" fill="#C9A227"/><text x="996" y="380" font-family="Georgia, serif" font-size="44" font-weight="bold" fill="#1A1A1A" text-anchor="start"><tspan x="996" dy="0">4</tspan></text><text x="996" y="450" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="normal" fill="#1A1A1A" text-anchor="start"><tspan x="996" dy="0">Outside those</tspan><tspan x="996" dy="33">documents, or</tspan><tspan x="996" dy="33">urgent: goes to a</tspan><tspan x="996" dy="33">person (named</tspan><tspan x="996" dy="33">operator and</tspan><tspan x="996" dy="33">office).</tspan></text><polygon points="1242,470 1270,470 1256,490" fill="#FFFFFF" transform="rotate(-90 1256 480)"/><rect x="1276" y="320" width="264" height="300" rx="14" fill="#C9A227"/><text x="1300" y="380" font-family="Georgia, serif" font-size="44" font-weight="bold" fill="#1A1A1A" text-anchor="start"><tspan x="1300" dy="0">5</tspan></text><text x="1300" y="450" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="normal" fill="#1A1A1A" text-anchor="start"><tspan x="1300" dy="0">Human review of</tspan><tspan x="1300" dy="33">what the system</tspan><tspan x="1300" dy="33">could not answer.</tspan></text><text x="60" y="720" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="normal" fill="#FFFFFF" text-anchor="start"><tspan x="60" dy="0">Prepared for: Your business. Question-response workflow only.</tspan></text><rect x="0" y="790" width="1600" height="110" fill="#C9A227"/><text x="800" y="848" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="normal" fill="#1A1A1A" text-anchor="middle"><tspan x="800" dy="0">The AI Agency Blueprint | 80 River St., Hoboken, NJ 07030 | 856-254-6000 | www.theaiagencyblueprint.com</tspan></text></svg>