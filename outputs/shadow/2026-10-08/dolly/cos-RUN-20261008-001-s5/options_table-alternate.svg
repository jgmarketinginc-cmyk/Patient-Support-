<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1160" viewBox="0 0 1600 1160"><rect width="1600" height="1160" fill="#1F3A5F"/><rect width="1600" height="36" fill="#C9A227"/><text x="60" y="110" font-family="Georgia, serif" font-size="34" font-weight="bold" fill="#FFFFFF" text-anchor="start"><tspan x="60" dy="0">The AI Agency Blueprint</tspan></text><text x="60" y="190" font-family="Georgia, serif" font-size="46" font-weight="bold" fill="#FFFFFF" text-anchor="start"><tspan x="60" dy="0">Your three options</tspan></text><text x="60" y="235" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="normal" fill="#FFFFFF" text-anchor="start"><tspan x="60" dy="0">Prepared for: Your business</tspan></text><rect x="60" y="270" width="1480" height="70" fill="#C9A227"/><text x="312" y="314" font-family="Georgia, serif" font-size="26" font-weight="bold" fill="#1A1A1A" text-anchor="start"><tspan x="312" dy="0">Option 1: AI Audit</tspan></text><text x="728" y="314" font-family="Georgia, serif" font-size="26" font-weight="bold" fill="#1A1A1A" text-anchor="start"><tspan x="728" dy="0">Option 2: AI Operations Install</tspan></text><text x="1144" y="314" font-family="Georgia, serif" font-size="26" font-weight="bold" fill="#1A1A1A" text-anchor="start"><tspan x="1144" dy="0">Option 3: Install + Managed Operations</tspan></text><rect x="60" y="340" width="1480" height="246" fill="#2B4C7A"/><text x="82" y="378" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="start"><tspan x="82" dy="0">Scope</tspan></text><text x="312" y="378" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="normal" fill="#FFFFFF" text-anchor="start"><tspan x="312" dy="0">Map what comes in and what the</tspan><tspan x="312" dy="29">system would handle, before any</tspan><tspan x="312" dy="29">build. Reduced scope, low-risk</tspan><tspan x="312" dy="29">first step.</tspan></text><text x="728" y="378" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="normal" fill="#FFFFFF" text-anchor="start"><tspan x="728" dy="0">Question-response system for</tspan><tspan x="728" dy="29">tenant questions, trained on</tspan><tspan x="728" dy="29">your own documents (lease</tspan><tspan x="728" dy="29">terms, portal steps, office</tspan><tspan x="728" dy="29">hours). Named human operator.</tspan><tspan x="728" dy="29">Anything outside approved</tspan><tspan x="728" dy="29">documents goes to a person.</tspan></text><text x="1144" y="378" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="normal" fill="#FFFFFF" text-anchor="start"><tspan x="1144" dy="0">Option 2 plus an optional</tspan><tspan x="1144" dy="29">Managed Operations retainer for</tspan><tspan x="1144" dy="29">the one workflow in scope.</tspan></text><rect x="60" y="586" width="1480" height="66" fill="#1F3A5F"/><text x="82" y="624" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="start"><tspan x="82" dy="0">Price</tspan></text><text x="312" y="624" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="normal" fill="#FFFFFF" text-anchor="start"><tspan x="312" dy="0">$1,500</tspan></text><text x="728" y="624" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="normal" fill="#FFFFFF" text-anchor="start"><tspan x="728" dy="0">See written proposal</tspan></text><text x="1144" y="624" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="normal" fill="#FFFFFF" text-anchor="start"><tspan x="1144" dy="0">See written proposal</tspan></text><rect x="60" y="652" width="1480" height="96" fill="#2B4C7A"/><text x="82" y="690" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="start"><tspan x="82" dy="0">Delivery</tspan></text><text x="312" y="690" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="normal" fill="#FFFFFF" text-anchor="start"><tspan x="312" dy="0">7 business days</tspan></text><text x="728" y="690" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="normal" fill="#FFFFFF" text-anchor="start"><tspan x="728" dy="0">21 days</tspan></text><text x="1144" y="690" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="normal" fill="#FFFFFF" text-anchor="start"><tspan x="1144" dy="0">21 days; retainer starts at</tspan><tspan x="1144" dy="29">delivery, if agreed</tspan></text><rect x="60" y="748" width="1480" height="96" fill="#1F3A5F"/><text x="82" y="786" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="start"><tspan x="82" dy="0">Payment</tspan></text><text x="312" y="786" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="normal" fill="#FFFFFF" text-anchor="start"><tspan x="312" dy="0">Upfront in full. Not credited</tspan><tspan x="312" dy="29">toward the Install.</tspan></text><text x="728" y="786" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="normal" fill="#FFFFFF" text-anchor="start"><tspan x="728" dy="0">Half at signing (deposit);</tspan><tspan x="728" dy="29">balance at 21-day delivery.</tspan></text><text x="1144" y="786" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="normal" fill="#FFFFFF" text-anchor="start"><tspan x="1144" dy="0">As Option 2; retainer billed</tspan><tspan x="1144" dy="29">monthly once agreed.</tspan></text><rect x="60" y="844" width="1480" height="126" fill="#2B4C7A"/><text x="82" y="882" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="start"><tspan x="82" dy="0">Labor-savings payback</tspan></text><text x="312" y="882" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="normal" fill="#FFFFFF" text-anchor="start"><tspan x="312" dy="0">None claimed (diagnostic)</tspan></text><text x="728" y="882" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="normal" fill="#FFFFFF" text-anchor="start"><tspan x="728" dy="0">About 14.1 to 19.8 months.</tspan><tspan x="728" dy="29">Target range; no results are</tspan><tspan x="728" dy="29">promised.</tspan></text><text x="1144" y="882" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="normal" fill="#FFFFFF" text-anchor="start"><tspan x="1144" dy="0">Does not pay back on labor</tspan><tspan x="1144" dy="29">savings alone.</tspan></text><rect x="60" y="970" width="1480" height="3" fill="#C9A227"/><rect x="0" y="1050" width="1600" height="110" fill="#C9A227"/><text x="800" y="1108" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="normal" fill="#1A1A1A" text-anchor="middle"><tspan x="800" dy="0">The AI Agency Blueprint | 80 River St., Hoboken, NJ 07030 | 856-254-6000 | www.theaiagencyblueprint.com</tspan></text></svg>